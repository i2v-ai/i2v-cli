name: Test the CLI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run build
      - run: node bin/i2v-cli.mjs --version
      - run: node bin/i2v-cli.mjs --help > /dev/null
      - run: node bin/i2v-cli.mjs list --type image --json | head -c 200
